<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — FitTrack</title><link rel="stylesheet" href="/css/app.css"><style>.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:32px;box-shadow:var(--shadow)}.auth-card h1{margin:15px 0 5px}.auth-card .field{margin:14px 0}.auth-card .btn{width:100%;margin-top:10px}.auth-brand{display:flex;gap:12px;align-items:center}.auth a{color:var(--primary);font-weight:700;text-decoration:none}.err{color:#ef4444;font-size:13px}</style></head><body><div class="auth"><form class="auth-card" id="reg"><div class="auth-brand"><div class="brandmark">F</div><b>FitTrack</b></div><h1>Create your account</h1><p class="muted">Your fitness records stay separated by user.</p><div class="field"><label>Full name</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8" required></div><p class="err" id="err"></p><button class="btn primary">Create account</button><p class="muted">Already registered? <a href="/login.html">Sign in</a></p></form></div><script>
document.getElementById("reg").addEventListener("submit",async function(e){
 e.preventDefault();
 const nameValue=document.getElementById("name").value.trim();
 const emailValue=document.getElementById("email").value.trim().toLowerCase();
 const passwordValue=document.getElementById("password").value;
 const err=document.getElementById("err"); err.textContent="";
 if(!nameValue){err.textContent="Please enter your name.";return}
 if(passwordValue.length<8){err.textContent="Password must contain at least 8 characters.";return}
 try{
  const res=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({name:nameValue,email:emailValue,password:passwordValue})});
  const data=await res.json();
  if(res.ok&&data.success)window.location.href="/login.html";
  else err.textContent=data.message||"Unable to create account.";
 }catch(ex){err.textContent="Unable to connect to FitTrack server."}
});
</script></body></html>
