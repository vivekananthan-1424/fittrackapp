<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — FitTrack</title><link rel="stylesheet" href="/css/app.css"><style>.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:32px;box-shadow:var(--shadow)}.auth-card h1{margin:15px 0 5px}.auth-card .field{margin:14px 0}.auth-card .btn{width:100%;margin-top:10px}.auth-brand{display:flex;gap:12px;align-items:center}.auth a{color:var(--primary);font-weight:700;text-decoration:none}.err{color:#ef4444;font-size:13px}</style></head><body><div class="auth"><form class="auth-card" method="post" action="/login"><div class="auth-brand"><div class="brandmark">F</div><b>FitTrack</b></div><h1>Welcome back</h1><p class="muted">Sign in to your personal fitness dashboard.</p><div class="field"><label>Email</label><input name="username" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><p class="err" id="err"></p><button class="btn primary">Sign in</button><p class="muted">New to FitTrack? <a href="/register.html">Create account</a></p></form></div><script>if(location.search.includes('error'))document.querySelector('#err').textContent='Invalid email or password';</script></body></html>
