name: FitTrack CI

on:
  push:
    branches:
      - fit
  pull_request:
    branches:
      - fit

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Make Maven Wrapper executable
        run:  chmod +x mvnw

      - name: Run tests
        run:  mvn clean test

      - name: Package Application
        run:  mvn package -DskipTests