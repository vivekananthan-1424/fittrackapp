name: FitTrack CI

on:
  push:
    branches:
      - fit
  pull_request:
    branches:
      - fit

permissions:
  contents: read   

concurrency:
  group: fittrack-ci-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Make Maven Wrapper executable
        run:  chmod +x mvnw

      - name: Run tests
        run:  mvn clean test

      - name: Package Application
        run:  mvn package -DskipTests
      
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: fittrack-application
          path: target/fittrack-2.0.0.jar
          retention-days: 7